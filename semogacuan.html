<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CATATDUIT v3.4.2 - 1 FILE FIX</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>button{cursor:pointer!important;touch-action:manipulation;pointer-events:auto!important} #modalLogin{z-index:99999!important;pointer-events:auto!important} .card{border-radius:20px;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.06)} .input{border:1.5px solid #e2e8f0;border-radius:14px;padding:12px;width:100%;min-height:46px} .tab-active{background:#BE1E2D;color:#fff!important}</style></head>
<body class="bg-[#f8fafc]">
<div id="modalLogin" class="fixed inset-0 bg-[#0f172a]/85 backdrop-blur-sm flex items-center justify-center p-4">
<div class="bg-white rounded-[28px] w-full max-w-[400px] p-7 shadow-2xl">
<div class="text-center"><h2 class="font-black text-[20px]">🔐 Pilih Akun</h2><p class="text-[11px] text-slate-500 mt-1">Punyaku password <b>112221</b> - Data lama masuk sini</p></div>
<div id="loginList" class="mt-5 space-y-2.5"></div>
<div id="passBox" class="hidden mt-5 border-t pt-5"><p class="text-[11px] font-bold">Password <span id="passAkunName"></span></p><input id="passInput" type="password" inputmode="numeric" placeholder="112221" class="input text-center text-[24px] font-black tracking-[8px] mt-1"><p id="passErr" class="hidden text-[11px] text-red-600 font-bold text-center mt-2">❌ Salah! Harusnya 112221</p><button onclick="loginNow()" class="w-full bg-[#BE1E2D] text-white py-4 rounded-full font-black mt-3">MASUK</button><button onclick="cancelPass()" class="w-full bg-slate-100 py-3 rounded-full text-[11px] mt-2">← Ganti Akun</button></div>
</div></div>
<div id="app" class="hidden">
<div class="bg-[#BE1E2D] text-white sticky top-0 z-30 p-3"><div class="flex justify-between items-center max-w-[1500px] mx-auto"><b>💰 v3.4.2 FIX</b><div class="flex gap-2"><span id="akunBadge" class="bg-white/20 px-3 py-1 rounded-full text-[11px]">Punyaku</span><button onclick="logout()" class="bg-white/10 px-2 py-1 rounded-full text-[10px]">Logout</button><button onclick="migrasi()" class="bg-amber-400 text-black px-3 py-2.5 rounded-full text-[10px] font-black">🔄 Migrasi Lama→Punyaku</button><button onclick="openAdd()" class="bg-white text-[#BE1E2D] px-5 py-2.5 rounded-full text-[12px] font-black">+ Transaksi</button></div></div></div>
<div class="max-w-[1500px] mx-auto p-3 grid grid-cols-1 lg:grid-cols-[360px_1fr] gap-3 mt-2"><div class="space-y-3"><div class="card p-4"><h2 class="font-black text-[11px]">👛 DOMPET <span id="dompetAkunName">Punyaku</span></h2><div id="listDompet" class="mt-3 space-y-2"></div><div class="mt-3 bg-slate-900 text-white p-4 rounded-2xl"><p class="text-[9px] opacity-60">TOTAL</p><b id="totalSaldo">Rp 0</b></div></div><div class="card p-3"><input id="searchAll" oninput="renderAll()" placeholder="🔍 Cari..." class="input"></div><div class="card p-4"><h2 class="font-black text-[11px]">📜 Transaksi (Punyaku + Lama)</h2><div id="listTransaksi" class="mt-3"></div></div></div><div id="right"><div id="view-keuangan" class="space-y-3"><div class="grid grid-cols-2 gap-3"><div class="card p-4 border-l-4 border-green-600"><p class="text-[9px] font-bold">Masuk</p><b id="inMonth">Rp 0</b></div><div class="card p-4 border-l-4 border-red-600"><p class="text-[9px] font-bold">Keluar</p><b id="outMonth">Rp 0</b></div></div><div class="card p-4"><canvas id="cashflowChart" height="140"></canvas></div><div class="card p-4"><canvas id="kategoriChart" height="200"></canvas></div></div></div></div></div>
<div id="modal" class="fixed inset-0 bg-black/60 hidden flex items-end md:items-center justify-center p-4"><div class="bg-white rounded-[28px] w-full max-w-[440px] p-6"><h2 class="font-black">+ Transaksi</h2><div class="mt-3 space-y-3"><div class="grid grid-cols-3 gap-2"><button onclick="setTipe('keluar')" id="btnKeluar" class="bg-[#BE1E2D] text-white py-3 rounded-full text-[12px]">Keluar</button><button onclick="setTipe('masuk')" id="btnMasuk" class="bg-slate-100 py-3 rounded-full text-[12px]">Masuk</button><button onclick="setTipe('pindah')" id="btnPindah" class="bg-slate-100 py-3 rounded-full text-[12px]">Pindah</button></div><input id="jml" type="number" class="input text-[22px] font-black" placeholder="50000"><select id="dompetSelect" class="input"></select><div id="tujuanWrap" class="hidden"><select id="dompetTujuan" class="input"></select></div><select id="kategori" class="input"><option>Makan</option><option>Transport</option><option>Bensin</option><option>Tagihan</option><option>Motor Servis</option><option>Cicilan Hutang</option><option>Gaji / Pemasukan</option><option>Lainnya</option></select><input id="catatan" class="input" placeholder="Catatan"><input id="tgl" type="date" class="input"><button onclick="saveTransaksi()" class="w-full bg-[#BE1E2D] text-white py-4 rounded-full font-black">SIMPAN KE PUNYAKU</button><button onclick="closeModal()" class="w-full bg-slate-100 py-3 rounded-full">Batal</button></div></div></div>
<script>const AKUNS=[{id:'punyaku',nama:'Punyaku',pass:'112221',desc:'🔐 Private - Data lama masuk sini'},{id:'keluarga',nama:'Keluarga Utama',pass:'',desc:'Data keluarga'},{id:'pribadi',nama:'Pribadi Mas',pass:'',desc:'Pribadi'}];let selAkun=null;function renderLogin(){document.getElementById('loginList').innerHTML=AKUNS.map(a=>`<button onclick="selectAkun('${a.id}')" class="w-full text-left border-2 ${selAkun===a.id?'border-[#BE1E2D] bg-red-50':'border-slate-200'} p-4 rounded-2xl"><p class="font-bold text-[13px]">${a.nama}</p><p class="text-[10px] text-slate-500">${a.desc}</p></button>`).join('');}function selectAkun(id){selAkun=id;let a=AKUNS.find(x=>x.id===id);document.getElementById('passAkunName').innerText=a.nama;renderLogin();if(a.pass){document.getElementById('passBox').classList.remove('hidden');document.getElementById('passInput').value='';setTimeout(()=>document.getElementById('passInput').focus(),100);}else{loginNow();}}function cancelPass(){selAkun=null;document.getElementById('passBox').classList.add('hidden');renderLogin();}function loginNow(){let a=AKUNS.find(x=>x.id===selAkun);if(!a)return alert('Pilih akun');let p=document.getElementById('passInput').value;if(a.pass&&p!==a.pass){document.getElementById('passErr').classList.remove('hidden');return;}localStorage.setItem('catatduit_akun',a.id);document.getElementById('modalLogin').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('akunBadge').innerText=a.nama;window.currentAkun=a.id;if(window.initApp)window.initApp();}function logout(){localStorage.removeItem('catatduit_akun');location.reload();}function openAdd(){document.getElementById('modal').classList.remove('hidden');}function closeModal(){document.getElementById('modal').classList.add('hidden');}renderLogin();let saved=localStorage.getItem('catatduit_akun');if(saved){let a=AKUNS.find(x=>x.id===saved);if(a&&!a.pass){selAkun=saved;setTimeout(()=>loginNow(),300);}}</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";import {getFirestore,collection,addDoc,onSnapshot,deleteDoc,doc,setDoc,getDocs,query,orderBy} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyA93AVYbEp3ocRCQEtrh0v7_9I5cpJKHiI",authDomain:"catatduit-55060.firebaseapp.com",projectId:"catatduit-55060",storageBucket:"catatduit-55060.firebasestorage.app",messagingSenderId:"1025155283832",appId:"1:1025155283832:web:ee5b46a39942357700e68d"};const app=initializeApp(firebaseConfig);const db=getFirestore(app);window.db=db;window.dompets=[];window.transaksis=[];window.hutangs=[];window.motors=[];window.charts={};window.currentAkun=localStorage.getItem('catatduit_akun')||'punyaku';let tipe='keluar';window.setTipe=(t)=>{tipe=t;document.getElementById('btnKeluar').className=t=='keluar'?'bg-[#BE1E2D] text-white py-3 rounded-full text-[12px] font-bold':'bg-slate-100 py-3 rounded-full text-[12px]';document.getElementById('btnMasuk').className=t=='masuk'?'bg-green-600 text-white py-3 rounded-full text-[12px] font-bold':'bg-slate-100 py-3 rounded-full text-[12px]';document.getElementById('btnPindah').className=t=='pindah'?'bg-blue-600 text-white py-3 rounded-full text-[12px] font-bold':'bg-slate-100 py-3 rounded-full text-[12px]';document.getElementById('tujuanWrap').classList.toggle('hidden',t!='pindah');};window.initApp=()=>{onSnapshot(collection(db,"dompets"),snap=>{window.dompets=[];snap.forEach(d=>window.dompets.push({id:d.id,...d.data()}));renderDompet();renderAll();});onSnapshot(query(collection(db,"transaksis"),orderBy("created","desc")),snap=>{window.transaksis=[];snap.forEach(d=>window.transaksis.push({id:d.id,...d.data()}));renderAll();});};function isMyData(d){let akun=d.akun||'';if(window.currentAkun==='punyaku')return akun==='punyaku'||akun==='keluarga'||akun===''||!d.akun;return akun===window.currentAkun;}window.renderDompet=()=>{let f=window.dompets.filter(isMyData);if(f.length==0)f=window.dompets.slice(0,5);document.getElementById('listDompet').innerHTML=f.map(d=>`<div class="flex justify-between border p-3 rounded-2xl"><div><p class="font-bold text-[12px]">${d.nama}</p><p class="text-[12px]">Rp ${Number(d.saldo||0).toLocaleString('id-ID')}</p></div><button onclick="hapusDompet('${d.id}')" class="w-8 h-8 bg-red-50 rounded-full">🗑️</button></div>`).join('');let opts=window.dompets.filter(isMyData);if(opts.length==0)opts=window.dompets;let html=opts.map(d=>`<option value="${d.id}">${d.nama} - Rp ${Number(d.saldo||0).toLocaleString('id-ID')}</option>`).join('');document.getElementById('dompetSelect').innerHTML=html;document.getElementById('dompetTujuan').innerHTML=html;};window.renderAll=()=>{let list=window.transaksis.filter(isMyData);let total=window.dompets.filter(isMyData).reduce((s,d)=>s+Number(d.saldo||0),0);document.getElementById('totalSaldo').innerText='Rp '+total.toLocaleString('id-ID');let now=new Date();let bln=now.getMonth();let thn=now.getFullYear();let inM=0,outM=0;list.forEach(t=>{let dt=new Date(t.tgl);if(dt.getMonth()==bln&&dt.getFullYear()==thn){if(t.tipe=='masuk')inM+=Number(t.jml);if(t.tipe=='keluar')outM+=Number(t.jml);}});document.getElementById('inMonth').innerText='Rp '+inM.toLocaleString('id-ID');document.getElementById('outMonth').innerText='Rp '+outM.toLocaleString('id-ID');document.getElementById('listTransaksi').innerHTML=list.slice(0,50).map(t=>`<div class="flex justify-between border-b py-2"><div><p class="font-bold text-[11px]">${t.kategori} Rp ${Number(t.jml).toLocaleString('id-ID')}</p><p class="text-[9px]">${t.catatan||''} • ${t.dompetNama||''} • ${t.tgl}</p></div><button onclick="hapusTransaksi('${t.id}','${t.dompetId}','${t.tujuanId||''}',${t.jml},'${t.tipe}')" class="w-8 h-8 bg-slate-100 rounded-full">✕</button></div>`).join('')||'<p class="text-[10px] text-center py-4">Belum ada transaksi - klik + atau Migrasi</p>';let kat={};list.forEach(t=>{if(t.tipe=='keluar')kat[t.kategori]=(kat[t.kategori]||0)+Number(t.jml);});let kKeys=Object.keys(kat);let kVals=Object.values(kat);if(window.charts.kat)window.charts.kat.destroy();if(kKeys.length)window.charts.kat=new Chart(document.getElementById('kategoriChart'),{type:'doughnut',data:{labels:kKeys,datasets:[{data:kVals}]}});let dim=new Date(thn,bln+1,0).getDate();let hIn=Array(dim).fill(0);let hOut=Array(dim).fill(0);list.forEach(t=>{let dt=new Date(t.tgl);if(dt.getMonth()==bln&&dt.getFullYear()==thn){let i=dt.getDate()-1;if(t.tipe=='masuk')hIn[i]+=Number(t.jml);if(t.tipe=='keluar')hOut[i]+=Number(t.jml);}});if(window.charts.cash)window.charts.cash.destroy();window.charts.cash=new Chart(document.getElementById('cashflowChart'),{type:'bar',data:{labels:Array.from({length:dim},(_,i)=>i+1),datasets:[{label:'Masuk',data:hIn,backgroundColor:'#16a34a'},{label:'Keluar',data:hOut,backgroundColor:'#BE1E2D'}]}});};window.addDompet=async()=>{let nama=prompt('Nama dompet');if(!nama)return;await addDoc(collection(db,"dompets"),{nama,saldo:0,akun:window.currentAkun});};window.hapusDompet=async(id)=>{if(!confirm('Hapus?'))return;await deleteDoc(doc(db,"dompets",id));};window.saveTransaksi=async()=>{let jml=Number(document.getElementById('jml').value);if(!jml)return alert('Isi jumlah');let dompetId=document.getElementById('dompetSelect').value;let dompet=window.dompets.find(d=>d.id===dompetId);let tujuanId=document.getElementById('dompetTujuan').value;let tujuan=window.dompets.find(d=>d.id===tujuanId);let kategori=document.getElementById('kategori').value;let catatan=document.getElementById('catatan').value;let tgl=document.getElementById('tgl').value||new Date().toISOString().slice(0,10);if(tipe=='keluar')await setDoc(doc(db,"dompets",dompetId),{...dompet,saldo:Number(dompet.saldo||0)-jml},{merge:true});if(tipe=='masuk')await setDoc(doc(db,"dompets",dompetId),{...dompet,saldo:Number(dompet.saldo||0)+jml},{merge:true});if(tipe=='pindah'){await setDoc(doc(db,"dompets",dompetId),{...dompet,saldo:Number(dompet.saldo||0)-jml},{merge:true});if(tujuan)await setDoc(doc(db,"dompets",tujuanId),{...tujuan,saldo:Number(tujuan.saldo||0)+jml},{merge:true});}await addDoc(collection(db,"transaksis"),{jml,tipe,dompetId,dompetNama:dompet.nama,tujuanId:tujuanId||null,kategori,catatan,tgl,akun:window.currentAkun,created:Date.now()});closeModal();};window.hapusTransaksi=async(id,dompetId,tujuanId,jml,ttipe)=>{if(!confirm('Hapus?'))return;let dompet=window.dompets.find(d=>d.id===dompetId);if(ttipe=='keluar'&&dompet)await setDoc(doc(db,"dompets",dompetId),{...dompet,saldo:Number(dompet.saldo||0)+Number(jml)},{merge:true});if(ttipe=='masuk'&&dompet)await setDoc(doc(db,"dompets",dompetId),{...dompet,saldo:Number(dompet.saldo||0)-Number(jml)},{merge:true});await deleteDoc(doc(db,"transaksis",id));};window.migrasi=async()=>{if(!confirm('Pindah semua data lama ke Punyaku?'))return;let c=0;for(let col of["dompets","transaksis","hutangs","motors"]){let snap=await getDocs(collection(db,col));for(let d of snap.docs){let data=d.data();if(!data.akun||data.akun==='keluarga'){await setDoc(doc(db,col,d.id),{...data,akun:'punyaku'},{merge:true});c++;}}}alert('✅ '+c+' data dipindah ke Punyaku');};document.getElementById('tgl').value=new Date().toISOString().slice(0,10);if(localStorage.getItem('catatduit_akun')){let a=AKUNS.find(x=>x.id===localStorage.getItem('catatduit_akun'));if(a&&!a.pass){selAkun=a.id;setTimeout(()=>loginNow(),300);}else if(localStorage.getItem('catatduit_akun')==='punyaku'){selAkun='punyaku';renderLogin();document.getElementById('passBox').classList.remove('hidden');}}
</script></body></html>
