<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMKM V4.6 ULTRA STABLE</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>.input{border:1px solid #e2e8f0; border-radius:14px; padding:10px 12px; font-size:11px; width:100%; background:white} .card{border-radius:20px; background:white; box-shadow:0 4px 20px rgba(0,0,0,.05)} .btn{cursor:pointer}</style>
</head>
<body class="bg-[#f6f5f2] pb-28">
<div class="bg-[#BE1E2D] text-white p-3 sticky top-0 z-40">
<div class="max-w-[1800px] mx-auto flex justify-between flex-wrap gap-2">
<div><b class="text-[13px]">🏭 UMKM V4.6 ULTRA - KERTANEGARA</b><p class="text-[9px] mt-1" id="fbStatus">📱 Mode Lokal Siap - Bisa langsung input</p></div>
<div class="flex gap-2 flex-wrap">
<button id="btnTambah" class="btn bg-white text-[#BE1E2D] px-4 py-2 rounded-full text-[11px] font-black">+ Tambah UMKM</button>
<button id="btnArsip" class="btn bg-black px-3 py-2 rounded-full text-[10px]">📚 Arsip</button>
<button id="btnBanding" class="btn bg-yellow-400 text-black px-3 py-2 rounded-full text-[10px] font-black">⚖️ Banding (<span id="countBanding">0</span>)</button>
<button id="btnLaporan" class="btn bg-green-600 px-3 py-2 rounded-full text-[10px]">📄 Laporan</button>
<button id="btnReset" class="btn bg-black/30 px-3 py-2 rounded-full text-[9px]">🗑️ Hapus Semua</button>
</div>
</div>
</div>

<div class="max-w-[1800px] mx-auto p-3">
<div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-[10px] mt-2">
<div class="card p-3"><b>Total UMKM</b><br><span id="totalUMKM" class="text-[18px] font-black">0</span><span class="text-[8px] block" id="srcLabel">LOKAL</span></div>
<div class="card p-3"><b>Layak Utama</b><br><span id="layakUtama" class="text-[18px] font-black text-green-600">0</span></div>
<div class="card p-3"><b>Per Jenis</b><br><span id="perJenis" class="text-[9px]">-</span></div>
<div class="card p-3"><b>Rata Skor</b><br><span id="rataSkor" class="text-[18px] font-black">0</span></div>
</div>

<div id="view-arsip" class="mt-3"><div class="card p-4"><div class="flex gap-2 flex-wrap"><input id="search" class="input flex-1" placeholder="Cari nama UMKM, bisa dihapus/edit..."><select id="filterJenis" class="input w-[150px]"><option value="">Semua Jenis</option><option>Makanan</option><option>Minuman</option><option>Kerajinan</option><option>Pertanian Olahan</option><option>Jasa</option><option>Lainnya</option></select></div><div id="listArsip" class="mt-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div></div></div>
<div id="view-banding" class="hidden mt-3 space-y-3"><div class="card p-4"><div id="selectedBanding" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div><button id="btnBandingkanSekarang" class="btn mt-3 w-full bg-[#BE1E2D] text-white py-3 rounded-full font-black text-[11px]">⚖️ BANDINGKAN SEKARANG</button></div><div class="grid grid-cols-1 md:grid-cols-2 gap-3"><div class="card p-4"><canvas id="compareChart" height="250"></canvas></div><div class="card p-4"><div id="ranking"></div><div id="rekomBanding" class="mt-2 bg-green-50 p-3 rounded-xl text-[11px] border"></div></div></div></div>
<div id="view-laporan" class="hidden mt-3"><div class="card p-4"><div class="flex justify-between flex-wrap gap-2"><b>📄 Laporan</b><div class="flex gap-2"><button id="btnPDF" class="btn bg-red-600 text-white px-3 py-2 rounded-full text-[10px]">PDF</button><button id="btnExcel" class="btn bg-green-600 text-white px-3 py-2 rounded-full text-[10px]">Excel</button><button id="btnJPG" class="btn bg-blue-600 text-white px-3 py-2 rounded-full text-[10px]">JPG</button></div></div><div id="laporanPreview" class="mt-4 bg-white border rounded-[20px] p-6"><div class="text-center border-b-2 border-[#BE1E2D] pb-4"><b>LAPORAN UMKM DESA KASIH - KERTANEGARA</b><br><span class="text-[10px]" id="tglLaporan"></span><div class="mt-3 grid grid-cols-3 gap-2 text-[10px]"><div class="bg-slate-50 p-2 rounded-xl border"><b id="lpTotal">0</b><br>Total</div><div class="bg-green-50 p-2 rounded-xl border"><b id="lpUtama">0</b><br>Utama</div><div class="bg-blue-50 p-2 rounded-xl border"><b id="lpRata">0</b><br>Rata</div></div></div><div class="mt-4"><table class="w-full mt-2 text-[9px] border" id="lpAll"><thead class="bg-slate-100"><tr><th class="border p-1">No</th><th class="border p-1 text-left">Nama</th><th class="border p-1">Jenis</th><th class="border p-1">Skor</th><th class="border p-1">Status</th><th class="border p-1">Alamat</th></tr></thead><tbody></tbody></table></div></div></div></div>
</div>

<div id="modalForm" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-3">
<div class="bg-white rounded-[20px] w-full max-w-[500px] max-h-[90vh] overflow-auto p-5">
<h2 class="font-black text-[14px]" id="modalTitle">+ Tambah UMKM</h2><div id="modalBody" class="mt-3 space-y-3"></div>
<div class="flex gap-2 mt-5"><button id="btnBatal" class="btn flex-1 bg-slate-200 py-3 rounded-full text-[11px]">Batal</button><button id="btnSimpan" class="btn flex-1 bg-[#BE1E2D] text-white py-3 rounded-full font-black text-[11px]">💾 Simpan</button></div>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBP1lvYR22XOf-IC_34gHEEkfolSthDTzo",
  authDomain: "kasih-kopdes.firebaseapp.com",
  databaseURL: "https://kasih-kopdes-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kasih-kopdes",
  storageBucket: "kasih-kopdes.firebasestorage.app",
  messagingSenderId: "746954171317",
  appId: "1:746954171317:web:c603cc408212a50ece2ffc",
};
let db, umkmRef, isFirebase=false, umkms=[], selectedIds=[], currentEditId=null, compareChart=null;

function calcScore(d){
 let now=parseFloat(d.prod_now)||0, max=parseFloat(d.prod_max)||1, alat=parseFloat(d.alat)||0, omzet=parseFloat(d.omzet)||0, lama=parseFloat(d.lama)||2;
 let total=Math.min(100, Math.round((now/max*20)+(alat*2)+(omzet?10:0)+40+lama*3));
 let status=total>=80?'LAYAK UTAMA':total>=60?'CUKUP':'BELUM';
 return {total, status, nama:d.nama, jenis:d.jenis, utilisasi: Math.round(now/max*100)||0, sProd:15, sSDM:10, sModal:10, sPasar:12, sLegal:10};
}

function saveLocal(){ localStorage.setItem('umkm_v46', JSON.stringify(umkms)); }
function loadLocal(){
 let data=JSON.parse(localStorage.getItem('umkm_v46')||localStorage.getItem('umkm_backup')||'[]');
 umkms=data;
 document.getElementById('srcLabel').innerText='LOKAL - Bisa Edit/Hapus';
 renderAll();
}

function renderAll(){ renderStats(); renderArsip(); renderLaporan(); }
function renderStats(){
 document.getElementById('totalUMKM').innerText=umkms.length;
 let scores=umkms.map(calcScore);
 document.getElementById('layakUtama').innerText=scores.filter(s=>s.total>=80).length;
 document.getElementById('rataSkor').innerText=scores.length? Math.round(scores.reduce((a,b)=>a+b.total,0)/scores.length):0;
 let perJenis={}; scores.forEach(s=>{ perJenis[s.jenis]=(perJenis[s.jenis]||0)+1; });
 document.getElementById('perJenis').innerText=Object.keys(perJenis).map(k=>`${k}:${perJenis[k]}`).join(', ')||'-';
}
function renderArsip(){
 let q=(document.getElementById('search').value||'').toLowerCase();
 let fj=document.getElementById('filterJenis').value;
 let filtered=umkms.filter(u=>{ if(q && !u.nama.toLowerCase().includes(q)) return false; if(fj && u.jenis!=fj) return false; return true; });
 document.getElementById('listArsip').innerHTML=filtered.map(u=>{
  let s=calcScore(u); let checked=selectedIds.includes(u.id);
  return `<div class="card p-4 border ${checked?'ring-2 ring-[#BE1E2D]':''}">
   <div class="flex justify-between"><div><b class="text-[13px]">${u.nama}</b> ${u._fb?'<span class="text-[8px] bg-blue-100 px-1 rounded">☁️</span>':'<span class="text-[8px] bg-yellow-100 px-1 rounded">📱</span>'}<br><span class="text-[9px] bg-slate-100 px-2 py-1 rounded-full">${u.jenis}</span> <span class="text-[9px] ${s.total>=80?'bg-green-100 text-green-700':s.total>=60?'bg-yellow-100':'bg-red-100'} px-2 py-1 rounded-full font-bold">${s.total}/100 - ${s.status}</span></div><input type="checkbox" data-check="${u.id}" ${checked?'checked':''} class="check-umkm w-5 h-5"></div>
   <div class="text-[10px] mt-2 text-slate-500">Prod: ${u.prod_now||0}/${u.prod_max||0} | Omzet: ${u.omzet||0}jt | ${u.alamat||''}</div>
   <div class="flex gap-2 mt-3"><button data-edit="${u.id}" class="btn-edit flex-1 bg-slate-900 text-white py-2 rounded-full text-[10px] font-bold">✏️ EDIT - Bisa dirubah</button><button data-del="${u.id}" class="btn-del bg-red-600 text-white px-4 py-2 rounded-full text-[10px] font-bold">🗑️ HAPUS</button></div>
  </div>`;
 }).join('') || '<div class="col-span-3 text-center p-10 text-slate-400"><b>Belum ada UMKM</b><br>Klik <b>+ Tambah UMKM</b> di atas, data bisa langsung diedit/hapus nanti.</div>';
 document.getElementById('countBanding').innerText=selectedIds.length;
 document.querySelectorAll('.check-umkm').forEach(el=> el.addEventListener('change', e=> toggleSelect(e.target.getAttribute('data-check'))));
 document.querySelectorAll('.btn-edit').forEach(el=> el.addEventListener('click', e=> openEdit(e.target.getAttribute('data-edit'))));
 document.querySelectorAll('.btn-del').forEach(el=> el.addEventListener('click', e=> deleteUMKM(e.target.getAttribute('data-del'))));
}
function toggleSelect(id){ if(selectedIds.includes(id)) selectedIds=selectedIds.filter(x=>x!=id); else { if(selectedIds.length>=3){ alert('Maks 3'); return; } selectedIds.push(id); } renderArsip(); renderSelected(); }
function renderSelected(){
 document.getElementById('selectedBanding').innerHTML=selectedIds.map(id=>{
  let u=umkms.find(x=>x.id==id); if(!u) return ''; let s=calcScore(u);
  return `<div class="card p-3 border"><b class="text-[11px]">${u.nama}</b><p class="text-[10px]">${u.jenis} - ${s.total}/100</p></div>`;
 }).join('')||'<p class="text-[11px] text-slate-400">Centang di Arsip dulu</p>';
}
function getModalHTML(d){
 let data=d||{nama:'', jenis:'Makanan', lama:'2', prod_now:'', prod_max:'', alat:'', omzet:'', alamat:''};
 return `<div><p class="text-[8px] font-bold text-[#BE1E2D]">Nama UMKM * (bisa dihapus/edit nanti)</p><input id="m_nama" class="input font-bold" value="${data.nama}"></div>
 <div class="grid grid-cols-2 gap-2"><div><p class="text-[8px] font-bold">Jenis</p><select id="m_jenis" class="input"><option ${data.jenis=='Makanan'?'selected':''}>Makanan</option><option ${data.jenis=='Minuman'?'selected':''}>Minuman</option><option ${data.jenis=='Kerajinan'?'selected':''}>Kerajinan</option><option ${data.jenis=='Pertanian Olahan'?'selected':''}>Pertanian Olahan</option><option ${data.jenis=='Jasa'?'selected':''}>Jasa</option><option ${data.jenis=='Lainnya'?'selected':''}>Lainnya</option></select></div><div><p class="text-[8px] font-bold">Lama</p><select id="m_lama" class="input"><option value="2" ${data.lama=='2'?'selected':''}>1-3 th</option><option value="4" ${data.lama=='4'?'selected':''}>3-5 th</option><option value="5" ${data.lama=='5'?'selected':''}>>5 th</option></select></div></div>
 <div class="grid grid-cols-2 gap-2"><div><p class="text-[8px] font-bold">Prod Sekarang</p><input id="m_prod_now" type="number" class="input" value="${data.prod_now}"></div><div><p class="text-[8px] font-bold">Maks</p><input id="m_prod_max" type="number" class="input" value="${data.prod_max}"></div></div>
 <div class="grid grid-cols-2 gap-2"><div><p class="text-[8px] font-bold">Alat</p><input id="m_alat" type="number" class="input" value="${data.alat}"></div><div><p class="text-[8px] font-bold">Omzet jt</p><input id="m_omzet" type="number" class="input" value="${data.omzet}"></div></div>
 <div><p class="text-[8px] font-bold">Alamat / HP (bisa dihapus/edit)</p><input id="m_alamat" class="input" value="${data.alamat||''}"></div>`;
}

document.getElementById('btnTambah').addEventListener('click', ()=>{ currentEditId=null; document.getElementById('modalTitle').innerText='+ Tambah UMKM Baru (bisa dihapus/edit nanti)'; document.getElementById('modalBody').innerHTML=getModalHTML(); document.getElementById('modalForm').classList.remove('hidden'); });
document.getElementById('btnArsip').addEventListener('click', ()=> setTab('arsip'));
document.getElementById('btnBanding').addEventListener('click', ()=> setTab('banding'));
document.getElementById('btnLaporan').addEventListener('click', ()=> setTab('laporan'));
document.getElementById('btnBatal').addEventListener('click', ()=> document.getElementById('modalForm').classList.add('hidden'));
document.getElementById('btnReset').addEventListener('click', ()=>{
 if(!confirm('HAPUS SEMUA DATA UMKM? Tidak bisa dikembalikan!')) return;
 if(confirm('Yakin hapus semua?')){
  umkms=[]; saveLocal(); if(isFirebase && umkmRef) umkmRef.remove(); renderAll(); alert('Semua data terhapus!');
 }
});
document.getElementById('btnSimpan').addEventListener('click', ()=>{
 let data={nama:document.getElementById('m_nama').value, jenis:document.getElementById('m_jenis').value, lama:document.getElementById('m_lama').value, prod_now:document.getElementById('m_prod_now').value, prod_max:document.getElementById('m_prod_max').value, alat:document.getElementById('m_alat').value, omzet:document.getElementById('m_omzet').value, alamat:document.getElementById('m_alamat').value, updated:Date.now()};
 if(!data.nama) return alert('Nama wajib diisi');
 if(currentEditId){ let idx=umkms.findIndex(x=>x.id==currentEditId); if(idx>=0) umkms[idx]={...umkms[idx], ...data}; }else{ umkms.push({id:'local_'+Date.now(), ...data, _fb:isFirebase}); }
 saveLocal();
 if(isFirebase && umkmRef){
  if(currentEditId && !currentEditId.startsWith('local_')) umkmRef.child(currentEditId).update(data); else if(!currentEditId) umkmRef.push({...data, created:Date.now()});
 }
 renderAll();
 document.getElementById('modalForm').classList.add('hidden');
});
document.getElementById('search').addEventListener('input', renderArsip);
document.getElementById('filterJenis').addEventListener('change', renderArsip);
document.getElementById('btnBandingkanSekarang').addEventListener('click', ()=>{
 if(selectedIds.length<2) return alert('Pilih minimal 2 di Arsip');
 let data=selectedIds.map(id=> umkms.find(x=>x.id==id)).map(calcScore); data.sort((a,b)=>b.total-a.total);
 document.getElementById('ranking').innerHTML=data.map((d,i)=>`<div class="flex justify-between border p-3 rounded-2xl ${i==0?'bg-green-50 border-green-300':''}"><div><b class="text-[12px]">${i==0?'🏆':i==1?'🥈':'🥉'} #${i+1} ${d.nama}</b><p class="text-[10px]">${d.jenis} - ${d.total}/100</p></div><b class="text-[16px]">${d.total}</b></div>`).join('');
 if(compareChart) compareChart.destroy();
 compareChart=new Chart(document.getElementById('compareChart'), {type:'bar', data:{labels:['Skor'], datasets:data.map((d,idx)=>({label:d.nama, data:[d.total], backgroundColor:['#2563eb','#16a34a','#ea580c'][idx]}))}, options:{responsive:true, scales:{y:{min:0,max:100}}}});
 document.getElementById('rekomBanding').innerText=`Keputusan: ${data[0].nama} paling kuat (${data[0].total}/100)`;
});
document.getElementById('btnPDF').addEventListener('click', async()=>{ const { jsPDF } = window.jspdf; let doc=new jsPDF('p','mm','a4'); let el=document.getElementById('laporanPreview'); let canvas=await html2canvas(el,{scale:2}); let img=canvas.toDataURL('image/png'); let w=doc.internal.pageSize.getWidth(); let h=(canvas.height*w)/canvas.width; doc.addImage(img,'PNG',0,0,w,h); doc.save('Laporan-UMKM.pdf'); });
document.getElementById('btnExcel').addEventListener('click', ()=>{ let csv="No,Nama,Jenis,Skor,Status,Omzet,Alamat\n"; umkms.map(u=> ({u, s:calcScore(u)})).sort((a,b)=>b.s.total-a.s.total).forEach((x,i)=>{ csv+=`${i+1},"${x.u.nama}","${x.u.jenis}",${x.s.total},${x.s.status},${x.u.omzet||0},"${x.u.alamat||''}"\n`; }); let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Laporan-UMKM.csv'; a.click(); });
document.getElementById('btnJPG').addEventListener('click', async()=>{ let el=document.getElementById('laporanPreview'); let canvas=await html2canvas(el,{scale:2}); let a=document.createElement('a'); a.href=canvas.toDataURL('image/jpeg',0.9); a.download='Laporan-UMKM.jpg'; a.click(); });

function openEdit(id){ currentEditId=id; let u=umkms.find(x=>x.id==id); document.getElementById('modalTitle').innerText='✏️ Edit UMKM - Bisa dirubah/hapus'; document.getElementById('modalBody').innerHTML=getModalHTML(u); document.getElementById('modalForm').classList.remove('hidden'); }
function deleteUMKM(id){
 if(!confirm('Hapus UMKM ini? Data akan hilang permanen, bisa dihapus/edit kapan saja.')) return;
 umkms=umkms.filter(x=>x.id!=id); saveLocal();
 if(isFirebase && !id.startsWith('local_') && umkmRef) umkmRef.child(id).remove();
 renderAll();
}
function setTab(t){
 document.getElementById('view-arsip').classList.toggle('hidden', t!='arsip');
 document.getElementById('view-banding').classList.toggle('hidden', t!='banding');
 document.getElementById('view-laporan').classList.toggle('hidden', t!='laporan');
 if(t=='banding') renderSelected();
 if(t=='laporan') renderLaporan();
}
function renderLaporan(){
 let scores=umkms.map(u=> ({u, s:calcScore(u)})).filter(x=>x.s); scores.sort((a,b)=>b.s.total-a.s.total);
 document.getElementById('tglLaporan').innerText=new Date().toLocaleDateString('id-ID',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
 document.getElementById('lpTotal').innerText=umkms.length;
 document.getElementById('lpUtama').innerText=scores.filter(x=>x.s.total>=80).length;
 document.getElementById('lpRata').innerText=scores.length? Math.round(scores.reduce((a,b)=>a+b.s.total,0)/scores.length):0;
 document.querySelector('#lpAll tbody').innerHTML=scores.map((x,i)=>`<tr><td class="border p-1 text-center">${i+1}</td><td class="border p-1 font-bold">${x.u.nama}</td><td class="border p-1">${x.s.jenis}</td><td class="border p-1 text-center">${x.s.total}</td><td class="border p-1">${x.s.status}</td><td class="border p-1">${x.u.alamat||'-'}</td></tr>`).join('')||'<tr><td colspan=6 class="border p-2 text-center">Belum ada data - tambah dulu, nanti bisa dihapus/edit</td></tr>';
}

// 1. LANGSUNG LOAD LOKAL - TIDAK NUNGGU FIREBASE
loadLocal();

// 2. COBA FIREBASE DI BELAKANG LAYAR
setTimeout(()=>{
 try{
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  db=firebase.database();
  umkmRef=db.ref('umkm_kertanegara_v4/list');
  document.getElementById('fbStatus').innerText='⏳ Coba konek Firebase di background...';
  umkmRef.on('value', snap=>{
   isFirebase=true;
   let data=snap.val(); 
   if(data){
    // kalau firebase ada data, pakai firebase
    let fbData=[]; Object.keys(data).forEach(k=> fbData.push({id:k, ...data[k], _fb:true}));
    if(fbData.length>0){ umkms=fbData; saveLocal(); }
   }
   document.getElementById('fbStatus').innerText='✅ Firebase Connected - '+umkms.length+' UMKM - Bisa hapus/edit realtime';
   document.getElementById('srcLabel').innerText='FIREBASE CLOUD - Bisa Edit/Hapus';
   renderAll();
  });
 }catch(e){
  document.getElementById('fbStatus').innerText='📱 Mode Lokal - Bisa hapus/edit - Firebase: '+e.message;
 }
},1000);
</script>
</body>
</html>
