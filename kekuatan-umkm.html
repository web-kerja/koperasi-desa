<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMKM V5.1 MINIMAL KLIK TEST</title>
<style>
body{font-family:system-ui; background:#f6f5f2; margin:0; padding:0}
.header{background:#BE1E2D; color:white; padding:12px; position:sticky; top:0; z-index:10}
.btn{border:none; border-radius:999px; padding:12px 18px; font-weight:900; font-size:13px; cursor:pointer; display:inline-block; margin:4px}
.btn-white{background:white; color:#BE1E2D}
.btn-black{background:black; color:white}
.btn-yellow{background:#facc15; color:black}
.btn-green{background:#16a34a; color:white}
.card{background:white; border-radius:20px; padding:16px; margin:8px; box-shadow:0 4px 12px rgba(0,0,0,.06)}
.input{border:1px solid #ddd; border-radius:12px; padding:12px; width:100%; box-sizing:border-box; margin:6px 0}
.label{font-size:9px; font-weight:800; color:#BE1E2D}
#modalForm{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; z-index:99; overflow:auto; padding:16px}
.modalbox{background:white; border-radius:20px; max-width:600px; margin:20px auto; overflow:hidden}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
<b>🏭 UMKM V5.1 MINIMAL - TEST KLIK DULU</b>
<p id="fbStatus" style="font-size:10px; margin:6px 0 0; background:rgba(0,0,0,.3); padding:6px 10px; border-radius:8px">📱 Mode Lokal - Tombol pakai onclick langsung - PASTI KLIK</p>
<div style="margin-top:10px">
<button class="btn btn-white" onclick="openTambah()">+ Tambah UMKM (TEST KLIK)</button>
<button class="btn btn-black" onclick="setTab('arsip')">📚 Arsip</button>
<button class="btn btn-yellow" onclick="setTab('banding')">⚖️ Banding (<span id="countBanding">0</span>)</button>
<button class="btn btn-green" onclick="setTab('laporan')">📄 Laporan</button>
</div>
</div>

<div style="max-width:1200px; margin:0 auto; padding:12px">
<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px">
<div class="card"><b>Total UMKM</b><br><span id="totalUMKM" style="font-size:22px; font-weight:900">0</span><br><span id="srcLabel" style="font-size:10px; color:green; font-weight:700">LOKAL AKTIF - KLIK OK</span></div>
<div class="card"><b>Test Klik</b><br><span id="testKlik" style="font-size:12px">Belum diklik</span></div>
</div>

<div id="view-arsip" class="card"><b>📚 Arsip UMKM + Analisis + Resiko</b><div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap"><input id="search" class="input" style="flex:1" placeholder="Cari..." oninput="renderArsip()"><select id="filterJenis" class="input" style="width:140px" onchange="renderArsip()"><option value="">Semua Jenis</option><option>Makanan</option><option>Minuman</option><option>Kerajinan</option><option>Pertanian Olahan</option><option>Jasa</option><option>Lainnya</option></select></div><div id="listArsip" style="margin-top:16px; display:grid; gap:12px"></div></div>
<div id="view-banding" class="card" style="display:none"><b>⚖️ Banding</b><div id="selectedBanding" style="margin-top:12px"></div><button class="btn btn-white" style="background:#BE1E2D; color:white; width:100%; margin-top:12px" onclick="bandingkan()">BANDINGKAN SEKARANG</button><div id="ranking" style="margin-top:12px"></div></div>
<div id="view-laporan" class="card" style="display:none"><b>📄 Laporan</b><p id="tglLaporan" style="font-size:11px"></p><div id="laporanIsi" style="margin-top:12px; font-size:11px"></div><div style="margin-top:12px"><button class="btn btn-green" onclick="downloadCSV()">Download Excel CSV</button></div></div>
</div>

<div id="modalForm">
<div class="modalbox">
<div style="background:#BE1E2D; color:white; padding:16px; display:flex; justify-content:space-between"><b id="modalTitle">+ Tambah UMKM</b><button class="btn" style="background:rgba(255,255,255,.2); color:white; padding:6px 12px" onclick="closeModal()">✕</button></div>
<div style="padding:16px" id="modalBody"></div>
<div id="liveAnalisis" style="background:#faf8f5; padding:16px; border-top:1px solid #eee"></div>
<div style="padding:12px; display:flex; gap:8px; border-top:1px solid #eee"><button class="btn" style="flex:1; background:#eee" onclick="closeModal()">Batal</button><button class="btn btn-white" style="flex:1; background:#BE1E2D; color:white" onclick="saveData()">💾 Simpan (Lokal + Firebase)</button></div>
</div>
</div>

<script>
// DATA
let umkms=[], selectedIds=[], currentEditId=null, isFirebase=false, umkmRef=null;

function calcFull(d){
 let now=parseFloat(d.prod_now)||0, max=parseFloat(d.prod_max)||1, harga=parseFloat(d.harga)||0, bahan=parseFloat(d.bahan_cost)||0, pel=parseFloat(d.pelanggan)||10, omzet=parseFloat(d.omzet)||0, modal=parseFloat(d.modal)||5, sdm=parseFloat(d.sdm)||2;
 let utilisasi = max>0 ? Math.min(100, Math.round(now/max*100)) : 0;
 let kapasitas_kosong = max-now;
 let omzet_per_pcs = harga>0?harga:20000;
 let potensi = kapasitas_kosong * omzet_per_pcs * 26 /1000000;
 let biaya_bahan = bahan * now * 26 /1000000;
 let laba = omzet - biaya_bahan - (modal*0.05+sdm*1.5);
 let margin = harga>0? Math.round((harga-bahan)/harga*100):0;
 let total = Math.min(100, Math.round(utilisasi*0.4 + (pel>10?20:pel*2) + (margin>30?20:margin*0.6) + 20));
 let risk = (bahan/harga>0.7 || pel<5 || utilisasi<40 || laba<0) ? 'tinggi' : (bahan/harga>0.5 || pel<15 || utilisasi<70 ? 'sedang' : 'rendah');
 return {total, utilisasi, potensi, laba, margin, risk, nama:d.nama, jenis:d.jenis, omzet, pel};
}

function getModalHTML(d){
 let data=d||{nama:'', jenis:'Makanan', lama:'2', prod_now:'', prod_max:'', alat:'1', sdm:'2', jam:'8', modal:'5', omzet:'', harga:'', bahan_cost:'', pelanggan:'10', alamat:''};
 return `<div><p class="label">Nama UMKM *</p><input id="m_nama" class="input" value="${data.nama}" oninput="renderLive()"></div>
 <div class="grid2"><div><p class="label">Jenis</p><select id="m_jenis" class="input" onchange="renderLive()"><option ${data.jenis=='Makanan'?'selected':''}>Makanan</option><option ${data.jenis=='Minuman'?'selected':''}>Minuman</option><option ${data.jenis=='Kerajinan'?'selected':''}>Kerajinan</option><option ${data.jenis=='Pertanian Olahan'?'selected':''}>Pertanian Olahan</option><option ${data.jenis=='Jasa'?'selected':''}>Jasa</option><option ${data.jenis=='Lainnya'?'selected':''}>Lainnya</option></select></div><div><p class="label">Lama</p><select id="m_lama" class="input"><option value="2" ${data.lama=='2'?'selected':''}>1-3 th</option><option value="4" ${data.lama=='4'?'selected':''}>3-5 th</option><option value="5" ${data.lama=='5'?'selected':''}>>5 th</option></select></div></div>
 <div class="grid2"><div><p class="label">Prod Sekarang /hari</p><input id="m_prod_now" type="number" class="input" value="${data.prod_now}" oninput="renderLive()"></div><div><p class="label">Maks /hari</p><input id="m_prod_max" type="number" class="input" value="${data.prod_max}" oninput="renderLive()"></div></div>
 <div class="grid2"><div><p class="label">Harga Jual /pcs Rp</p><input id="m_harga" type="number" class="input" value="${data.harga||''}" oninput="renderLive()"></div><div><p class="label">Biaya Bahan /pcs Rp</p><input id="m_bahan_cost" type="number" class="input" value="${data.bahan_cost||''}" oninput="renderLive()"></div></div>
 <div class="grid2"><div><p class="label">Omzet jt/bln</p><input id="m_omzet" type="number" class="input" value="${data.omzet}" oninput="renderLive()"></div><div><p class="label">Modal jt</p><input id="m_modal" type="number" class="input" value="${data.modal}" oninput="renderLive()"></div></div>
 <div><p class="label">Pelanggan Tetap</p><input id="m_pelanggan" type="number" class="input" value="${data.pelanggan}" oninput="renderLive()"></div>
 <div><p class="label">Alamat / HP</p><input id="m_alamat" class="input" value="${data.alamat||''}"></div>`;
}

function renderLive(){
 let d={ nama: document.getElementById('m_nama')?.value||'UMKM Baru', prod_now: document.getElementById('m_prod_now')?.value||0, prod_max: document.getElementById('m_prod_max')?.value||0, harga: document.getElementById('m_harga')?.value||0, bahan_cost: document.getElementById('m_bahan_cost')?.value||0, omzet: document.getElementById('m_omzet')?.value||0, modal: document.getElementById('m_modal')?.value||0, pelanggan: document.getElementById('m_pelanggan')?.value||0, sdm: document.getElementById('m_sdm')?.value||2, jenis:'Makanan' };
 let a=calcFull(d);
 document.getElementById('liveAnalisis').innerHTML=`<b>📊 ANALISIS LIVE + RESIKO</b><br><br><div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px; text-align:center"><div class="card" style="margin:0"><b style="font-size:18px; color:${a.total>=80?'green':a.total>=60?'orange':'red'}">${a.total}</b><br><span style="font-size:9px">${a.total>=80?'LAYAK UTAMA':'CUKUP'}</span></div><div class="card" style="margin:0"><b>${a.utilisasi}%</b><br><span style="font-size:8px">Utilisasi</span></div><div class="card" style="margin:0"><b>Rp ${a.laba.toFixed(1)}jt</b><br><span style="font-size:8px">Laba</span></div><div class="card" style="margin:0"><b>+Rp ${a.potensi.toFixed(1)}jt</b><br><span style="font-size:8px">Potensi</span></div></div><div class="card" style="margin:8px 0 0">Margin ${a.margin}% - Prod ${d.prod_now}/${d.prod_max} - Pelanggan ${d.pelanggan} - Laba <b>Rp ${a.laba.toFixed(1)}jt</b> - Resiko <b style="color:${a.risk=='tinggi'?'red':a.risk=='sedang'?'orange':'green'}">${a.risk.toUpperCase()}</b></div>`;
}

function openTambah(){
 document.getElementById('testKlik').innerText='✅ Tombol KLIK BERHASIL! Modal kebuka';
 currentEditId=null;
 document.getElementById('modalTitle').innerText='+ Tambah UMKM + Analisis Live';
 document.getElementById('modalBody').innerHTML=getModalHTML();
 document.getElementById('modalForm').style.display='block';
 renderLive();
}
function closeModal(){ document.getElementById('modalForm').style.display='none'; }
function openEdit(id){
 currentEditId=id;
 let u=umkms.find(x=>x.id==id);
 document.getElementById('modalTitle').innerText='✏️ Edit UMKM';
 document.getElementById('modalBody').innerHTML=getModalHTML(u);
 document.getElementById('modalForm').style.display='block';
 renderLive();
}
function saveData(){
 let data={nama:document.getElementById('m_nama').value, jenis:document.getElementById('m_jenis').value, lama:document.getElementById('m_lama').value, prod_now:document.getElementById('m_prod_now').value, prod_max:document.getElementById('m_prod_max').value, alat:document.getElementById('m_alat')?.value||1, sdm:document.getElementById('m_sdm')?.value||2, jam:document.getElementById('m_jam')?.value||8, modal:document.getElementById('m_modal').value, omzet:document.getElementById('m_omzet').value, harga:document.getElementById('m_harga').value, bahan_cost:document.getElementById('m_bahan_cost').value, pelanggan:document.getElementById('m_pelanggan').value, alamat:document.getElementById('m_alamat').value, updated:Date.now()};
 if(!data.nama) return alert('Nama wajib');
 if(currentEditId){ let idx=umkms.findIndex(x=>x.id==currentEditId); if(idx>=0) umkms[idx]={...umkms[idx], ...data}; if(isFirebase && !currentEditId.startsWith('local_') && umkmRef) umkmRef.child(currentEditId).update(data); }
 else { let id='local_'+Date.now(); umkms.push({id, ...data}); if(isFirebase && umkmRef) umkmRef.push({...data, created:Date.now()}); }
 localStorage.setItem('umkm_v51', JSON.stringify(umkms));
 localStorage.setItem('umkm_v50', JSON.stringify(umkms));
 renderAll(); closeModal();
}
function deleteUMKM(id){ if(!confirm('Hapus?')) return; umkms=umkms.filter(x=>x.id!=id); localStorage.setItem('umkm_v51', JSON.stringify(umkms)); if(isFirebase && !id.startsWith('local_') && umkmRef) umkmRef.child(id).remove(); renderAll(); }
function loadLocal(){
 for(let k of ['umkm_v51','umkm_v50','umkm_v49','umkm_v48','umkm_v47','umkm_backup']){
  try{ let d=JSON.parse(localStorage.getItem(k)||'null'); if(d && d.length>0){ umkms=d; break; } }catch(e){}
 }
 renderAll();
}
function renderAll(){
 document.getElementById('totalUMKM').innerText=umkms.length;
 document.getElementById('countBanding').innerText=selectedIds.length;
 renderArsip(); renderLaporan();
}
function renderArsip(){
 let q=(document.getElementById('search').value||'').toLowerCase();
 let fj=document.getElementById('filterJenis').value;
 let filtered=umkms.filter(u=>{ if(q && !u.nama.toLowerCase().includes(q)) return false; if(fj && u.jenis!=fj) return false; return true; });
 document.getElementById('listArsip').innerHTML=filtered.map(u=>{
  let s=calcFull(u); let checked=selectedIds.includes(u.id);
  return `<div class="card" style="border:${checked?'2px solid #BE1E2D':''}"><div style="display:flex; justify-content:space-between"><div><b>${u.nama}</b> <span style="font-size:10px; padding:2px 6px; border-radius:999px; background:${s.risk=='tinggi'?'#fee2e2':s.risk=='sedang'?'#fef9c3':'#dcfce7'}">${s.risk.toUpperCase()}</span><br><span style="font-size:10px; background:#eee; padding:2px 6px; border-radius:999px">${u.jenis}</span> <span style="font-size:10px; background:${s.total>=80?'#dcfce7':'#fef9c3'}; padding:2px 6px; border-radius:999px; font-weight:700">${s.total}/100</span></div><input type="checkbox" ${checked?'checked':''} onchange="toggleSelect('${u.id}')"></div><div style="margin-top:8px; font-size:11px; background:#f6f5f2; padding:8px; border-radius:12px">💰 Laba Rp ${s.laba.toFixed(1)}jt - Margin ${s.margin}% - Potensi +Rp ${s.potensi.toFixed(1)}jt - Util ${s.utilisasi}%</div><div style="display:flex; gap:8px; margin-top:10px"><button class="btn" style="flex:1; background:black; color:white" onclick="openEdit('${u.id}')">✏️ Edit</button><button class="btn" style="background:#dc2626; color:white" onclick="deleteUMKM('${u.id}')">🗑️ Hapus</button></div></div>`;
 }).join('') || '<div style="text-align:center; padding:30px; color:#999">Belum ada data. Klik + Tambah UMKM di atas - harusnya langsung kebuka form.</div>';
}
function toggleSelect(id){ if(selectedIds.includes(id)) selectedIds=selectedIds.filter(x=>x!=id); else { if(selectedIds.length>=3){ alert('Maks 3'); return; } selectedIds.push(id); } renderArsip(); renderSelected(); }
function renderSelected(){ document.getElementById('selectedBanding').innerHTML=selectedIds.map(id=>{ let u=umkms.find(x=>x.id==id); if(!u) return ''; let s=calcFull(u); return `<div class="card" style="margin:4px 0"><b>${u.nama}</b> - Laba Rp ${s.laba.toFixed(1)}jt - Skor ${s.total}</div>`; }).join('')||'<p style="font-size:11px; color:#999">Centang di Arsip dulu</p>'; }
function setTab(t){ document.getElementById('view-arsip').style.display=t=='arsip'?'block':'none'; document.getElementById('view-banding').style.display=t=='banding'?'block':'none'; document.getElementById('view-laporan').style.display=t=='laporan'?'block':'none'; if(t=='banding') renderSelected(); if(t=='laporan') renderLaporan(); }
function renderLaporan(){
 let scores=umkms.map(u=> ({u, s:calcFull(u)})).sort((a,b)=>b.s.total-a.s.total);
 document.getElementById('tglLaporan').innerText=new Date().toLocaleDateString('id-ID',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
 document.getElementById('laporanIsi').innerHTML=scores.map((x,i)=>`${i+1}. ${x.u.nama} - Skor ${x.s.total} - Laba Rp ${x.s.laba.toFixed(1)}jt - Potensi +Rp ${x.s.potensi.toFixed(1)}jt - Resiko ${x.s.risk}<br>`).join('')||'Kosong';
}
function bandingkan(){ if(selectedIds.length<2) return alert('Pilih minimal 2'); let data=selectedIds.map(id=> umkms.find(x=>x.id==id)).map(calcFull); data.sort((a,b)=>b.total-a.total); document.getElementById('ranking').innerHTML=data.map((d,i)=>`<div class="card" style="margin:4px 0; ${i==0?'background:#dcfce7':''}"><b>${i==0?'🏆':i==1?'🥈':'🥉'} ${d.nama} - Skor ${d.total} - Laba Rp ${d.laba.toFixed(1)}jt</b><br>Potensi +Rp ${d.potensi.toFixed(1)}jt - Resiko ${d.risk}</div>`).join(''); }
function downloadCSV(){ let csv="No,Nama,Jenis,Skor,Laba,Potensi,Resiko,Omzet\n"; umkms.map(u=> ({u, s:calcFull(u)})).forEach((x,i)=>{ csv+=`${i+1},"${x.u.nama}","${x.u.jenis}",${x.s.total},${x.s.laba.toFixed(1)},${x.s.potensi.toFixed(1)},${x.s.risk},${x.u.omzet||0}\n`; }); let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Laporan-UMKM.csv'; a.click(); }

// INIT - LANGSUNG JALAN TANPA TUNGGU CDN
loadLocal();
document.getElementById('fbStatus').innerText='📱 V5.1 MINIMAL - Tombol onclick langsung - PASTI KLIK - Test klik tombol di atas';

// FIREBASE DI BELAKANG - TIDAK BLOCK TOMBOL
setTimeout(()=>{
 let s=document.createElement('script'); s.src='https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js';
 s.onload=()=>{
  let s2=document.createElement('script'); s2.src='https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js';
  s2.onload=()=>{
   try{
    const firebaseConfig = { apiKey: "AIzaSyBP1lvYR22XOf-IC_34gHEEkfolSthDTzo", authDomain: "kasih-kopdes.firebaseapp.com", databaseURL: "https://kasih-kopdes-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "kasih-kopdes", storageBucket: "kasih-kopdes.firebasestorage.app", messagingSenderId: "746954171317", appId: "1:746954171317:web:c603cc408212a50ece2ffc", };
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    let db=firebase.database(); umkmRef=db.ref('umkm_kertanegara_v4/list');
    document.getElementById('fbStatus').innerText='⏳ Firebase mencoba background... tombol tetap bisa diklik';
    umkmRef.on('value', snap=>{
     isFirebase=true;
     let data=snap.val();
     if(data){ let fbData=[]; Object.keys(data).forEach(k=> fbData.push({id:k, ...data[k]})); if(fbData.length>0){ umkms=fbData; localStorage.setItem('umkm_v51', JSON.stringify(umkms)); } }
     document.getElementById('fbStatus').innerText='✅ Firebase Connected - '+umkms.length+' UMKM - Realtime AKTIF - '+ (fbData?'Sync antar HP OK':'DB kosong');
     document.getElementById('srcLabel').innerText='FIREBASE REALTIME - '+umkms.length+' data - KLIK OK';
     renderAll();
    }, err=>{
     document.getElementById('fbStatus').innerText='⚠️ Firebase Error: '+err.message+' - Tetap Lokal (klik tetap OK)';
    });
   }catch(e){ document.getElementById('fbStatus').innerText='📱 Mode Lokal - Firebase: '+e.message; }
  };
  document.head.appendChild(s2);
 };
 document.head.appendChild(s);
}, 1500);
</script>
</body>
</html>
