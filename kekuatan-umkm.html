<body>

</div>

<script>
let umkms=[], selectedIds=[], selectedLaporan=[], selectedProposal=null, currentEdit=null, umkmRef=null, isFirebase=false, navOpen=true;
const DB_URL="https://kasih-kopdes-default-rtdb.asia-southeast1.firebasedatabase.app";
function toggleNav(){navOpen=!navOpen;document.getElementById('navMenu').style.display=navOpen?'flex':'none';document.getElementById('btnMenu').innerText=navOpen?'✕ Tutup':'☰ Menu'}
function parseJt(v){if(!v) return 0;let s=String(v).toLowerCase().replace(/\s/g,'').replace('jt','').replace('juta','').trim();let rb=s.includes('rb');s=s.replace('rb','').replace(',','.');let n=parseFloat(s);if(isNaN(n)) return 0;if(rb) return n/1000;return n}
function formatRp(jt){if(jt==0) return 'Rp 0';if(jt<1) return 'Rp '+(jt*1000).toLocaleString('id-ID')+' ribu';return 'Rp '+jt.toLocaleString('id-ID')+' jt'}
function downloadJPG(elementId, filename){let el=document.getElementById(elementId);if(!el) return alert('Pilih data dulu');if(el.innerText.includes('Pilih 1 UMKM')) return alert('Buat laporan/proposal dulu');let btn=event?.target;let oldText=btn?.innerText;if(btn) btn.innerText='⏳ Membuat JPG...';html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true}).then(canvas=>{let link=document.createElement('a');link.download=filename+'-'+new Date().toISOString().slice(0,10)+'.jpg';link.href=canvas.toDataURL('image/jpeg',0.92);link.click();if(btn) btn.innerText=oldText||'📸 Download JPG';}).catch(e=>{alert('Gagal JPG: '+e.message);if(btn) btn.innerText=oldText})}
function calc(d){let now=parseFloat(d.prod_now)||0,max=parseFloat(d.prod_max)||1,harga=parseFloat(d.harga)||0,bahan=parseFloat(d.bahan)||0,pel=parseFloat(d.pel)||10,omzet=parseJt(d.omzet)||0,modal=parseJt(d.modal)||5,lama=parseFloat(d.lama)||2;let util=max>0?Math.min(100,Math.round(now/max*100)):0;let kosong=Math.max(0,max-now);let potensi=kosong*(harga||20000)*26/1000000;let biaya=bahan*now*26/1000000;let laba=omzet-biaya-(modal*0.05+2.4);let margin=harga>0?Math.round((harga-bahan)/harga*100):0;let total=Math.min(100,Math.round(util*0.4+(pel>5?15:pel*2)+(margin>0?margin*0.3:0)+25+(lama>3?10:lama*2)));let status=total>=80?'LAYAK UTAMA':total>=60?'CUKUP':'BELUM';let risks=[];if(harga>0&&bahan/harga>0.7) risks.push({t:'Bahan',l:'tinggi',d:`Bahan ${Math.round(bahan/harga*100)}% margin ${margin}% tipis`,m:'Supplier Purbalingga, grosir, naik harga 10%'});else if(harga>0&&bahan/harga>0.5) risks.push({t:'Bahan',l:'sedang',d:`Bahan ${Math.round(bahan/harga*100)}%`,m:'Kontrak harga'});else risks.push({t:'Bahan',l:'rendah',d:`Margin ${margin}% bagus`,m:'Pertahankan'});if(pel<5) risks.push({t:'Pasar',l:'tinggi',d:`Pelanggan ${pel}`,m:'WA pelanggan, titip 5 warung'});else if(pel<15) risks.push({t:'Pasar',l:'sedang',d:`Pelanggan ${pel}`,m:'Promo'});else risks.push({t:'Pasar',l:'rendah',d:`Pelanggan ${pel} loyal`,m:'Referal'});if(util<40) risks.push({t:'Operasional',l:'tinggi',d:`Util ${util}% nganggur ${kosong}`,m:'Custom order, sewa alat'});else if(util<70) risks.push({t:'Operasional',l:'sedang',d:`Util ${util}%`,m:'Tambah SDM'});else risks.push({t:'Operasional',l:'rendah',d:`Util ${util}% optimal`,m:'Tambah alat'});if(laba<0) risks.push({t:'Keuangan',l:'tinggi',d:`Rugi Rp ${laba.toFixed(1)}jt`,m:'Potong ops, naik harga 15%'});else if(laba<3) risks.push({t:'Keuangan',l:'sedang',d:`Laba tipis Rp ${laba.toFixed(1)}jt`,m:'Naik produksi 20%'});else risks.push({t:'Keuangan',l:'rendah',d:`Laba Rp ${laba.toFixed(1)}jt`,m:'Tabung 20%'});let high=risks.filter(r=>r.l=='tinggi').length;let level=high>=2?'tinggi':high==1?'sedang':'rendah';let narasi=`<b>KONDISI:</b> UMKM ${d.nama||'ini'} jenis ${d.jenis||'-'} (${d.lama_label||lama+' th'}). Prod ${now}/${max} pcs (${util}%), ${d.alat||1} alat, omzet ${formatRp(omzet)}/bln, harga Rp ${harga.toLocaleString()}, bahan Rp ${bahan.toLocaleString()}, margin ${margin}%, laba Rp ${laba.toFixed(1)}jt, pelanggan ${pel}.<br><br><b>MASALAH:</b> Skor ${total}/100 (${status}). ${util<50?`Util rendah ${util}% kosong ${kosong} pcs, potensi hilang Rp ${potensi.toFixed(1)}jt.`:`Util ${util}% baik.`} ${pel<10?` Pelanggan ${pel} rawan.`:` `}<br><br><b>SARAN 6 BULAN:</b> Bulan 1-2 atasi ${risks.filter(r=>r.l=='tinggi').map(r=>r.t).join(', ')||'optimasi'}. Bulan 3-4 naikkan jadi ${Math.ceil(max*0.8)} pcs kejar 80%, potensi Rp ${potensi.toFixed(1)}jt. Bulan 5-6 jika 80+ ajukan Mitra Utama Kopdes.`;return {total,util,potensi,laba,margin,status,risks,level,high,narasi,omzet,nama:d.nama,jenis:d.jenis,pel,max,now,harga,bahan,kosong,biaya,lama_label:d.lama_label||lama+' th'}}
function getForm(d){let data=d||{nama:'',jenis:'Makanan',jenis_custom:'',lama:'2',lama_label:'1 - 2 tahun',lama_tgl:'',prod_now:'10',prod_max:'20',alat:'1',sdm:'2',jam:'8',modal:'5',omzet:'',harga:'15000',bahan:'8000',pel:'10',alamat:''};return `<p class="label">Nama UMKM *</p><input id="m_nama" class="input" value="${data.nama}" oninput="renderLive()"><p class="label">Jenis Usaha - Lainnya isi sendiri</p><select id="m_jenis" class="input" onchange="handleJenis();renderLive()"><option ${data.jenis=='Makanan'?'selected':''}>Makanan</option><option ${data.jenis=='Minuman'?'selected':''}>Minuman</option><option ${data.jenis=='Kerajinan'?'selected':''}>Kerajinan</option><option ${data.jenis=='Pertanian Olahan'?'selected':''}>Pertanian Olahan</option><option ${data.jenis=='Jasa'?'selected':''}>Jasa</option><option ${data.jenis=='Fashion'?'selected':''}>Fashion</option><option ${data.jenis=='Frozen Food'?'selected':''}>Frozen Food</option><option ${data.jenis=='Herbal / Jamu'?'selected':''}>Herbal / Jamu</option><option ${data.jenis_asli=='Lainnya'?'selected':''}>Lainnya (isi sendiri)</option></select><input id="m_jenis_custom" class="input" placeholder="Contoh: Sambal Kemasan..." value="${data.jenis_custom||''}" style="display:${data.jenis_asli=='Lainnya'?'block':'none'};margin-top:6px;border:2px solid #BE1E2D" oninput="renderLive()"><p class="label">Lama Usaha</p><select id="m_lama" class="input" onchange="handleLama();renderLive()"><option value="0.25" ${data.lama=='0.25'?'selected':''}>< 6 bulan</option><option value="0.75" ${data.lama=='0.75'?'selected':''}>6-12 bulan</option><option value="1.5" ${data.lama=='1.5'?'selected':''}>1-2 tahun</option><option value="2.5" ${data.lama=='2.5'?'selected':''}>2-3 tahun</option><option value="4" ${data.lama=='4'?'selected':''}>3-5 tahun</option><option value="7" ${data.lama=='7'?'selected':''}>5-10 tahun</option><option value="12" ${data.lama=='12'?'selected':''}>>10 tahun</option><option value="custom" ${data.lama_label&&data.lama_label.includes('Sejak')?'selected':''}>📅 Tanggal Spesifik</option></select><div id="wrap_tgl" style="display:${data.lama_label&&data.lama_label.includes('Sejak')?'block':'none'}"><input id="m_lama_tgl" type="date" class="input" value="${data.lama_tgl||''}" onchange="hitungTgl()" style="border:2px solid #BE1E2D"><b id="hasil_tgl" style="font-size:11px">${data.lama_label||''}</b></div><input type="hidden" id="m_lama_final" value="${data.lama}"><input type="hidden" id="m_lama_label_final" value="${data.lama_label||''}"><div class="grid2"><div><p class="label">Prod sekarang /hari</p><input id="m_prod_now" type="number" class="input" value="${data.prod_now}" oninput="renderLive()"></div><div><p class="label">Maks /hari</p><input id="m_prod_max" type="number" class="input" value="${data.prod_max}" oninput="renderLive()"></div></div><div class="grid2"><div><p class="label">Alat</p><input id="m_alat" type="number" class="input" value="${data.alat}" oninput="renderLive()"></div><div><p class="label">SDM</p><input id="m_sdm" type="number" class="input" value="${data.sdm}" oninput="renderLive()"></div></div><div class="grid2"><div><p class="label">Jam kerja</p><input id="m_jam" type="number" class="input" value="${data.jam}" oninput="renderLive()"></div><div><p class="label">Harga jual Rp /pcs</p><input id="m_harga" type="number" class="input" value="${data.harga}" oninput="renderLive()"></div></div><div class="grid2"><div><p class="label">Bahan Rp /pcs</p><input id="m_bahan" type="number" class="input" value="${data.bahan}" oninput="renderLive()"></div><div><p class="label">Omzet jt/bln - Bisa 1,5 / 500rb</p><input id="m_omzet" type="text" inputmode="decimal" class="input" value="${data.omzet}" placeholder="Contoh: 1,5" oninput="renderLive()"><div id="prevOm" style="color:green;font-weight:800;font-size:11px"></div></div></div><div class="grid2"><div><p class="label">Modal jt - Bisa 1,5 / 500rb</p><input id="m_modal" type="text" inputmode="decimal" class="input" value="${data.modal}" placeholder="5" oninput="renderLive()"><div id="prevMo" style="color:green;font-weight:800;font-size:11px"></div></div><div><p class="label">Pelanggan</p><input id="m_pel" type="number" class="input" value="${data.pel}" oninput="renderLive()"></div></div><p class="label">Alamat / HP</p><input id="m_alamat" class="input" value="${data.alamat||''}">`}
function handleJenis(){let j=document.getElementById('m_jenis').value;document.getElementById('m_jenis_custom').style.display=j.includes('Lainnya')?'block':'none'}
function handleLama(){let l=document.getElementById('m_lama').value;let c=l=='custom';document.getElementById('wrap_tgl').style.display=c?'block':'none';if(!c){document.getElementById('m_lama_final').value=l;document.getElementById('m_lama_label_final').value=document.getElementById('m_lama').options[document.getElementById('m_lama').selectedIndex].text}}
function hitungSelisih(tgl){if(!tgl) return 0;let s=new Date(tgl),n=new Date();return ((n-s)/(1000*60*60*24*365)).toFixed(1)}
function hitungTgl(){let tgl=document.getElementById('m_lama_tgl').value;if(!tgl) return;let th=hitungSelisih(tgl);document.getElementById('hasil_tgl').innerText=`Sejak ${tgl} (${th} th)`;document.getElementById('m_lama_final').value=th;document.getElementById('m_lama_label_final').value=`Sejak ${tgl} (${th} th)`;renderLive()}
function renderLive(){let jenisSel=document.getElementById('m_jenis')?.value||'Makanan',jenisCus=document.getElementById('m_jenis_custom')?.value||'',finalJenis=(jenisSel.includes('Lainnya')&&jenisCus)?jenisCus:jenisSel;let d={nama:document.getElementById('m_nama')?.value||'UMKM Baru',jenis:finalJenis,prod_now:document.getElementById('m_prod_now')?.value||0,prod_max:document.getElementById('m_prod_max')?.value||0,harga:document.getElementById('m_harga')?.value||0,bahan:document.getElementById('m_bahan')?.value||0,omzet:document.getElementById('m_omzet')?.value||0,modal:document.getElementById('m_modal')?.value||0,pel:document.getElementById('m_pel')?.value||0,sdm:document.getElementById('m_sdm')?.value||2,alat:document.getElementById('m_alat')?.value||1,lama:document.getElementById('m_lama_final')?.value||document.getElementById('m_lama')?.value||2,lama_label:document.getElementById('m_lama_label_final')?.value||'2 th'};let om=parseJt(d.omzet),mo=parseJt(d.modal);let pOm=document.getElementById('prevOm');if(pOm) pOm.innerText=om>0?formatRp(om):'';let pMo=document.getElementById('prevMo');if(pMo) pMo.innerText=mo>0?formatRp(mo):'';let c=calc(d);document.getElementById('liveAnalisis').innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:center"><div style="background:${c.total>=80?'#dcfce7':'#fef3c7'};padding:8px;border-radius:8px"><b style="font-size:16px">${c.total}</b><br>${c.status}</div><div style="background:#f3f4f6;padding:8px;border-radius:8px"><b>Rp ${c.laba.toFixed(1)}jt</b><br>Laba</div><div style="background:#dbeafe;padding:8px;border-radius:8px"><b>+Rp ${c.potensi.toFixed(1)}jt</b><br>Potensi</div>
                                                                                                                                                                                                                                                                                                                             function openTambah(){currentEdit=null;document.getElementById('modalTitle').innerText='+ Tambah UMKM';document.getElementById('modalBody').innerHTML=getForm();document.getElementById('modal').style.display='block';setTimeout(renderLive,50)}
function closeModal(){document.getElementById('modal').style.display='none'}
function openEdit(id){currentEdit=id;let u=umkms.find(x=>x.id==id);document.getElementById('modalTitle').innerText='Edit UMKM';document.getElementById('modalBody').innerHTML=getForm(u);document.getElementById('modal').style.display='block';setTimeout(renderLive,50)}
function simpan(){let jenisSel=document.getElementById('m_jenis').value,jenisCus=document.getElementById('m_jenis_custom').value,finalJenis=(jenisSel.includes('Lainnya')&&jenisCus)?jenisCus:jenisSel;let lamaSel=document.getElementById('m_lama').value,lamaFin=document.getElementById('m_lama_final').value||lamaSel,lamaLab=document.getElementById('m_lama_label_final').value||document.getElementById('m_lama').options[document.getElementById('m_lama').selectedIndex].text,lamaTgl=document.getElementById('m_lama_tgl')?.value||'';let data={nama:document.getElementById('m_nama').value,jenis:finalJenis,jenis_custom:jenisCus,jenis_asli:jenisSel,lama:lamaFin,lama_label:lamaLab,lama_tgl:lamaTgl,prod_now:document.getElementById('m_prod_now').value,prod_max:document.getElementById('m_prod_max').value,alat:document.getElementById('m_alat').value,sdm:document.getElementById('m_sdm').value,jam:document.getElementById('m_jam').value,modal:document.getElementById('m_modal').value,omzet:document.getElementById('m_omzet').value,harga:document.getElementById('m_harga').value,bahan:document.getElementById('m_bahan').value,pel:document.getElementById('m_pel').value,alamat:document.getElementById('m_alamat').value,updated:Date.now()};if(!data.nama) return alert('Nama wajib');if(jenisSel.includes('Lainnya')&&!jenisCus) return alert('Isi jenis custom');if(currentEdit){let idx=umkms.findIndex(x=>x.id==currentEdit);if(idx>=0) umkms[idx]={...umkms[idx],...data};if(isFirebase&&!String(currentEdit).startsWith('local_')&&umkmRef) umkmRef.child(currentEdit).update(data)}else{let id='local_'+Date.now();umkms.push({id,...data});if(isFirebase&&umkmRef) umkmRef.push({...data,created:Date.now()})}localStorage.setItem('umkm_v58',JSON.stringify(umkms));renderAll();closeModal()}
function hapus(id){if(!confirm('Hapus?')) return;umkms=umkms.filter(x=>x.id!=id);localStorage.setItem('umkm_v58',JSON.stringify(umkms));if(isFirebase&&!String(id).startsWith('local_')&&umkmRef) umkmRef.child(id).remove();renderAll()}
function renderAll(){renderArsip();renderLaporanCheck();renderProposalCheck()}
function renderArsip(){let q=(document.getElementById('search').value||'').toLowerCase(),fj=document.getElementById('filterJenis').value;let filtered=umkms.filter(u=>{if(q&&!u.nama.toLowerCase().includes(q)) return false;if(fj&&!u.jenis.toLowerCase().includes(fj.toLowerCase())&&u.jenis!=fj) return false;return true});document.getElementById('listArsip').innerHTML=filtered.map(u=>{let c=calc(u);let checked=selectedIds.includes(u.id);return `<div class="card" style="border:${checked?'2px solid #BE1E2D':'1px solid #eee'}"><div style="display:flex;justify-content:space-between"><div><b style="font-size:14px">${u.nama}</b> <span class="badge risk-${c.level}">${c.level.toUpperCase()}</span><br><span class="badge" style="background:#eee">${u.jenis}</span> <span class="badge" style="background:${c.total>=80?'#dcfce7':'#fef3c7'};font-weight:800">${c.total}/100</span><br><span style="font-size:11px;color:#666">Lama: ${c.lama_label} | Omzet: ${formatRp(c.omzet)}</span></div><input type="checkbox" ${checked?'checked':''} onchange="toggleSelect('${u.id}')" style="width:20px;height:20px"></div><div style="margin-top:6px;font-size:11px;background:#fafafa;padding:8px;border-radius:8px">Laba Rp ${c.laba.toFixed(1)}jt - Util ${c.util}% - Potensi +Rp ${c.potensi.toFixed(1)}jt</div><div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn btn-small btn-black" style="flex:1" onclick="openEdit('${u.id}')">✏️ Edit</button><button class="btn btn-small btn-red" style="flex:1" onclick="showDetail('${u.id}')">📖 Panjang</button><button class="btn btn-small" style="background:#dc2626;color:white" onclick="hapus('${u.id}')">🗑️</button></div></div>`}).join('')||'<p style="text-align:center;color:#999;padding:20px">Belum ada data - Klik + Tambah</p>'}
function showDetail(id){let u=umkms.find(x=>x.id==id);let c=calc(u);let el=document.getElementById('detailPanjang');el.style.display='block';el.innerHTML=`<div id="detailCapture" class="jpg-capture" style="background:white;border-radius:12px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center"><b style="font-size:15px">📖 ${u.nama} - Analisis Lengkap</b><div class="no-print" style="display:flex;gap:6px"><button class="btn btn-small btn-green" onclick="downloadJPG('detailCapture','Analisis-${u.nama}')">📸 Download JPG</button><button class="btn btn-small" style="background:#eee" onclick="document.getElementById('detailPanjang').style.display='none'">✕ Tutup</button></div></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;text-align:center"><div class="card" style="margin:0;padding:8px"><b style="font-size:18px">${c.total}</b><br>${c.status}</div><div class="card" style="margin:0;padding:8px"><b>Rp ${c.laba.toFixed(1)}jt</b><br>Laba</div><div class="card" style="margin:0;padding:8px"><b>+Rp ${c.potensi.toFixed(1)}jt</b><br>Potensi</div><div class="card" style="margin:0;padding:8px"><b>${c.util}%</b><br>Util</div></div><div style="margin-top:10px"><b>⚠️ Resiko + Mitigasi:</b><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px;margin-top:6px">${c.risks.map(r=>`<div class="card" style="margin:0;border-left:4px solid ${r.l=='tinggi'?'#dc2626':'#16a34a'};padding:8px"><b>${r.t} - ${r.l.toUpperCase()}</b><br><span style="font-size:11px">${r.d}</span><br><div style="background:#f9fafb;padding:6px;border-radius:6px;margin-top:4px;font-size:11px">💡 ${r.m}</div></div>`).join('')}</div></div><div class="card" style="background:#fffbeb;border:1px solid #fde68a;margin-top:10px;font-size:12px;line-height:1.7"><b>📝 PENJELASAN LENGKAP:</b><br><br>${c.narasi}</div><div style="margin-top:8px;text-align:center;font-size:9px;color:#999">UMKM Desa Kasih - Kertanegara - ${new Date().toLocaleDateString('id-ID')}</div></div>`;el.scrollIntoView({behavior:'smooth'})}
function toggleSelect(id){if(selectedIds.includes(id)) selectedIds=selectedIds.filter(x=>x!=id);else{if(selectedIds.length>=3){alert('Maks 3');return} selectedIds.push(id)}renderArsip();renderSelected()}
function renderSelected(){document.getElementById('selectedBanding').innerHTML=selectedIds.map(id=>{let u=umkms.find(x=>x.id==id);if(!u) return '';let c=calc(u);return `<div class="card" style="margin:4px 0;padding:8px"><b>${u.nama}</b> - Skor ${c.total}</div>`}).join('')||'<p style="font-size:11px;color:#999">Centang di Arsip dulu</p>'}
function bandingkan(){if(selectedIds.length<2) return alert('Centang 2 UMKM di Arsip dulu');let data=selectedIds.map(id=>umkms.find(x=>x.id==id)).map(u=>calc(u)).sort((a,b)=>b.total-a.total);document.getElementById('ranking').innerHTML=data.map((d,i)=>`<div class="card" style="${i==0?'background:#dcfce7;border:2px solid #16a34a':''}"><b>${i==0?'🏆 REKOMENDASI: ':''}${d.nama} - Skor ${d.total}/100 - Laba Rp ${d.laba.toFixed(1)}jt</b><br><span style="font-size:11px">${d.narasi.substring(0,180)}...</span><div class="no-print" style="margin-top:6px"><button class="btn btn-small btn-green" onclick="downloadJPG('ranking','Banding-UMKM')">📸 JPG Hasil Banding</button></div></div>`).join('')}
function setTab(t){document.getElementById('view-arsip').style.display=t=='arsip'?'block':'none';document.getElementById('view-banding').style.display=t=='banding'?'block':'none';document.getElementById('view-laporan').style.display=t=='laporan'?'block':'none';document.getElementById('view-proposal').style.display=t=='proposal'?'block':'none';if(t=='banding') renderSelected();if(t=='laporan') buatLaporan();toggleNav();if(window.innerWidth<=768) document.getElementById('navMenu').style.display='none';navOpen=false;document.getElementById('btnMenu').innerText='☰ Menu'}
function selectAllLap(v){selectedLaporan=v?umkms.map(u=>u.id):[];document.querySelectorAll('.chk-lap').forEach(c=>c.checked=v);buatLaporan()}
function renderLaporanCheck(){document.getElementById('listLaporanCheck').innerHTML=umkms.map(u=>`<label style="display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #eee;font-size:12px"><input type="checkbox" class="chk-lap" value="${u.id}" ${selectedLaporan.includes(u.id)?'checked':''} onchange="toggleLap('${u.id}')" style="width:16px;height:16px"> <b>${u.nama}</b> - ${calc(u).total}/100</label>`).join('')||'Belum ada'}
function toggleLap(id){if(selectedLaporan.includes(id)) selectedLaporan=selectedLaporan.filter(x=>x!=id);else selectedLaporan.push(id);buatLaporan()}
function buatLaporan(){if(selectedLaporan.length==0) selectedLaporan=umkms.map(u=>u.id);let sel=umkms.filter(u=>selectedLaporan.includes(u.id)).map(u=>({u,c:calc(u)})).sort((a,b)=>b.c.total-a.c.total);document.getElementById('tglLaporan').innerText=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' - '+sel.length+' UMKM';document.getElementById('lpTotal').innerText=sel.length;document.getElementById('lpLaba').innerText='Rp '+sel.reduce((a,b)=>a+b.c.laba,0).toFixed(1)+'jt';let html='';sel.forEach((x,i)=>{html+=`<div class="card" style="border:1px solid #eee;padding:10px"><b style="font-size:13px">${i+1}. ${x.u.nama} - ${x.c.total}/100 - ${x.c.status}</b> <span class="badge risk-${x.c.level}">${x.c.level}</span><br><span style="font-size:10px">Jenis: ${x.u.jenis} | Lama: ${x.c.lama_label} | Omzet: ${formatRp(x.c.omzet)} | Laba Rp ${x.c.laba.toFixed(1)}jt</span><div style="margin-top:6px;font-size:11px;background:#fafaf5;padding:8px;border-radius:8px;line-height:1.6"><b>📖 Analisis:</b><br>${x.c.narasi}</div></div>`});document.getElementById('laporanIsi').innerHTML=html||'<p>Pilih UMKM</p>'}
function downloadExcel(){let sel=umkms.filter(u=>selectedLaporan.includes(u.id));if(sel.length==0) sel=umkms;let csv="No,Nama,Jenis,Lama,Skor,Status,Omzet_jt,Laba_jt,Potensi_jt,Margin,Resiko,Analisis\n";sel.map(u=>({u,c:calc(u)})).forEach((x,i)=>{csv+=`${i+1},"${x.u.nama}","${x.u.jenis}","${x.c.lama_label}",${x.c.total},${x.c.status},${x.c.omzet},${x.c.laba.toFixed(1)},${x.c.potensi.toFixed(1)},${x.c.margin}%,${x.c.level},"${x.c.narasi.replace(/<[^>]*>/g,' ').replace(/"/g,'""')}"\n`});let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='Laporan-UMKM-V5.8.csv';document.body.appendChild(a);a.click();document.body.removeChild(a)}
function renderProposalCheck(){document.getElementById('listProposalCheck').innerHTML=umkms.map(u=>`<label style="display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid #eee;font-size:12px"><input type="radio" name="prop" value="${u.id}" onchange="selectedProposal='${u.id}'" style="width:16px;height:16px"> <b>${u.nama}</b> - ${u.jenis}</label>`).join('')||'Belum ada'}
function buatProposal(){if(!selectedProposal) return alert('Pilih 1 UMKM dulu');let u=umkms.find(x=>x.id==selectedProposal);let c=calc(u);document.getElementById('proposalArea').innerHTML=`<div style="text-align:center;border-bottom:3px solid #BE1E2D;padding-bottom:8px"><b style="font-size:14px">PROPOSAL BISNIS UMKM</b><br><b style="font-size:16px;color:#BE1E2D">${u.nama.toUpperCase()}</b><br><span style="font-size:10px">Jenis: ${u.jenis} | Lama: ${c.lama_label} | ${new Date().toLocaleDateString('id-ID')}</span></div><div style="margin-top:10px"><b style="color:#BE1E2D">1. LATAR BELAKANG</b><p style="font-size:12px">UMKM ${u.nama} jenis ${u.jenis} lama ${c.lama_label} produksi ${u.prod_now||0}/${u.prod_max||0} pcs, omzet ${formatRp(c.omzet)}/bln.</p></div><div style="margin-top:10px"><b style="color:#BE1E2D">2. ANALISIS PANJANG JELAS</b><div style="font-size:12px;margin-top:4px">${c.narasi}</div></div><div style="margin-top:10px"><b style="color:#BE1E2D">3. RESIKO & MITIGASI</b><div style="margin-top:6px">${c.risks.map(r=>`<div class="card" style="margin:4px 0;border-left:4px solid ${r.l=='tinggi'?'red':'green'};padding:8px"><b>${r.t} - ${r.l}</b><br><span style="font-size:11px">${r.d}</span><br><div style="background:#f3f4f6;padding:6px;border-radius:6px;margin-top:4px;font-size:11px">💡 ${r.m}</div></div>`).join('')}</div></div><div style="margin-top:10px"><b style="color:#BE1E2D">4. MODAL & PROYEKSI</b><p style="font-size:12px">Kebutuhan Rp ${(c.biaya+3.5+c.kosong*0.5).toFixed(1)}jt. Proyeksi 6 bln Rp ${((c.omzet+c.potensi)*6).toFixed(1)}jt. Status: ${c.status}</p></div><div style="margin-top:8px;text-align:center;font-size:9px;color:#999">UMKM Desa Kasih - ${new Date().toLocaleDateString('id-ID')}</div>`}
document.addEventListener('DOMContentLoaded',()=>{for(let k of ['umkm_v58','umkm_v57','umkm_v56','umkm_v54']){try{let d=JSON.parse(localStorage.getItem(k)||'null');if(d&&d.length>0){umkms=d;break}}catch(e){}}renderAll();document.getElementById('tglLaporan').innerText=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});initFirebase();if(window.innerWidth<=768){document.getElementById('navMenu').style.display='none';navOpen=false;document.getElementById('btnMenu').innerText='☰ Menu'}});
function initFirebase(){document.getElementById('fbStatus').innerText='⏳ Menghubungkan...';let s=document.createElement('script');s.src='https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js';s.onload=()=>{let s2=document.createElement('script');s2.src='https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js';s2.onload=()=>{try{const cfg={databaseURL:DB_URL};if(!firebase.apps.length) firebase.initializeApp(cfg);let db=firebase.database();umkmRef=db.ref('umkm_kertanegara_v4/list');umkmRef.on('value',snap=>{isFirebase=true;let data=snap.val();if(data){let fb=[];Object.keys(data).forEach(k=>fb.push({id:k,...data[k]}));if(fb.length>0){umkms=fb;localStorage.setItem('umkm_v58',JSON.stringify(umkms))}}document.getElementById('fbStatus').innerText='✅ '+umkms.length+' UMKM';renderAll()},err=>{document.getElementById('fbStatus').innerText='📱 Lokal';renderAll()})}catch(e){document.getElementById('fbStatus').innerText='📱 Lokal'}};document.head.appendChild(s2)};document.head.appendChild(s)}
</script>
</body></html>
